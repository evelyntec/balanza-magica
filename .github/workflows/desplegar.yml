# Despliegue automático al hosting (cPanel de V2Networks).
#
# Cuando las pruebas pasan en main, compila el juego y el servidor, los sube a la
# carpeta de la aplicación Node.js y la reinicia. Luego comprueba en
# /api/salud que quedó en línea la versión recién subida.
#
# Mientras no existan los secretos, el flujo termina sin hacer nada (no falla).
# Guía paso a paso: docs/despliegue.md
name: Desplegar

on:
  workflow_run:
    workflows: [Pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      BALANZA_URL: ${{ secrets.BALANZA_URL }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ¿Está configurado el despliegue?
        id: config
        run: |
          if [ -z "$SSH_HOST" ] && [ -z "$FTP_HOST" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue sin configurar::Agrega los secretos SSH_* (o FTP_*) y BALANZA_URL. Guía: docs/despliegue.md"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v4
        if: steps.config.outputs.listo == 'si'
        with:
          node-version: 22
          cache: npm

      - name: Compilar juego y servidor
        if: steps.config.outputs.listo == 'si'
        run: |
          npm ci
          npm run build
        env:
          BALANZA_VERSION: ${{ env.COMMIT }}

      - name: Subir por SSH (rsync)
        if: steps.config.outputs.listo == 'si' && env.SSH_HOST != '' && env.FTP_HOST == ''
        env:
          SSH_USUARIO: ${{ secrets.SSH_USUARIO }}
          SSH_PUERTO: ${{ secrets.SSH_PUERTO }}
          SSH_CLAVE_PRIVADA: ${{ secrets.SSH_CLAVE_PRIVADA }}
          SSH_FRASE: ${{ secrets.SSH_FRASE }}
          SSH_HOSTS_CONOCIDOS: ${{ secrets.SSH_HOSTS_CONOCIDOS }}
          RUTA_APP: ${{ secrets.RUTA_APP }}
        run: |
          set -euo pipefail
          : "${RUTA_APP:?Falta el secreto RUTA_APP (por ejemplo /home/tuusuario/balanza-app)}"
          PUERTO="$(printf '%s' "${SSH_PUERTO:-22}" | tr -d '[:space:]')"
          HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          USUARIO="$(printf '%s' "$SSH_USUARIO" | tr -d '[:space:]')"
          RUTA_APP="$(printf '%s' "$RUTA_APP" | tr -d '\r' | sed 's/[[:space:]]*$//; s#/*$##')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Al copiar desde Windows se cuelan retornos de carro (\r) y espacios: se limpian.
          # (Solo se quitan líneas vacías al inicio y al final: las claves con contraseña llevan una línea vacía interna obligatoria.)
          printf '%s\n' "$SSH_CLAVE_PRIVADA" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | awk 'NF { if (vacias) for (i = 0; i < vacias; i++) print ""; vacias = 0; print; empezo = 1; next } empezo { vacias++ }' > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          if ! head -n1 ~/.ssh/id_despliegue | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "::error title=Clave SSH::SSH_CLAVE_PRIVADA no empieza con '-----BEGIN ... PRIVATE KEY-----'. Vuelve a copiarla completa desde cPanel (Ver/Descargar)."
            exit 1
          fi
          if ! tail -n1 ~/.ssh/id_despliegue | grep -q -- '-----END .*PRIVATE KEY-----'; then
            echo "::error title=Clave SSH::SSH_CLAVE_PRIVADA no termina con '-----END ... PRIVATE KEY-----'. Faltó copiar el final."
            exit 1
          fi
          # Si cPanel exigió una contraseña para la clave, se quita solo en esta máquina temporal.
          FRASE="$(printf '%s' "${SSH_FRASE:-}" | tr -d '\r\n')"
          if [ -n "$FRASE" ]; then
            if ! salida="$(ssh-keygen -p -q -P "$FRASE" -N "" -f ~/.ssh/id_despliegue 2>&1)"; then
              echo "::error title=Contraseña de la clave::No se pudo abrir la clave con SSH_FRASE ($salida). Revisa que SSH_FRASE sea exactamente la contraseña usada al generar la clave en cPanel."
              exit 1
            fi
          elif ! ssh-keygen -y -P "" -f ~/.ssh/id_despliegue > /dev/null 2>&1; then
            echo "::error title=Contraseña de la clave::La clave tiene contraseña: agrega el secreto SSH_FRASE."
            exit 1
          fi
          if [ -n "${SSH_HOSTS_CONOCIDOS:-}" ]; then
            printf '%s\n' "$SSH_HOSTS_CONOCIDOS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            echo "::warning::Sin SSH_HOSTS_CONOCIDOS: se confía en la huella del servidor en el primer contacto."
            ssh-keyscan -T 15 -p "$PUERTO" "$HOST" > ~/.ssh/known_hosts 2>/dev/null || true
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error title=Servidor SSH::No hubo respuesta SSH en $HOST, puerto $PUERTO. Confirma el puerto SSH con el soporte de V2Networks y guárdalo en SSH_PUERTO."
              exit 1
            fi
          fi
          SSH="ssh -i ~/.ssh/id_despliegue -p $PUERTO -o BatchMode=yes -o ConnectTimeout=20"
          if ! salida="$($SSH "$USUARIO@$HOST" "mkdir -p '$RUTA_APP' && echo conectado" 2>&1)"; then
            echo "::error title=Conexión SSH::$(printf '%s' "$salida" | tail -n 2 | tr '\n' ' ') — Si dice 'Permission denied', revisa que la clave esté Autorizada en cPanel y que SSH_USUARIO sea profeso2."
            exit 1
          fi
          # --delete quita archivos viejos del juego, pero nunca .env, tmp/, registros ni node_modules.
          rsync -az --delete \
            --exclude '.env' --exclude 'tmp/' --exclude '*.log' --exclude 'node_modules' --exclude '.htaccess' \
            -e "$SSH" apps/servidor/dist/ "$USUARIO@$HOST:$RUTA_APP/"
          # Passenger (Setup Node.js App) reinicia la aplicación al tocar tmp/restart.txt.
          $SSH "$USUARIO@$HOST" "mkdir -p '$RUTA_APP/tmp' && touch '$RUTA_APP/tmp/restart.txt'"
          echo "::notice title=Subida lista::Archivos sincronizados en $RUTA_APP y aplicación reiniciada."
          rm -f ~/.ssh/id_despliegue

      - name: Subir por FTP seguro
        if: steps.config.outputs.listo == 'si' && env.FTP_HOST != ''
        env:
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_CLAVE: ${{ secrets.FTP_CLAVE }}
          FTP_RUTA: ${{ secrets.FTP_RUTA }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lftp > /dev/null
          HOST="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          USUARIO="$(printf '%s' "$FTP_USUARIO" | tr -d '[:space:]')"
          DESTINO="$(printf '%s' "${FTP_RUTA:-/}" | tr -d '\r' | sed 's/[[:space:]]*$//')"
          DESTINO="${DESTINO%/}"; DESTINO="${DESTINO:-/}"
          TMP="${DESTINO%/}/tmp"
          mkdir -p reinicio && date > reinicio/restart.txt
          # La contraseña va por variable de entorno: así funciona aunque tenga comillas o símbolos.
          export LFTP_PASSWORD="$(printf '%s' "$FTP_CLAVE" | tr -d '\r\n')"
          if ! salida="$(lftp -u "$USUARIO" --env-password -e "
            set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5;
            mirror --reverse --delete --verbose=1 --parallel=4 \
              --exclude-glob .env --exclude-glob '*.log' --exclude tmp/ --exclude node_modules/ --exclude-glob .htaccess \
              apps/servidor/dist '$DESTINO';
            mkdir -p -f '$TMP';
            put -O '$TMP' reinicio/restart.txt;
            bye" "$HOST" 2>&1)"; then
            printf '%s\n' "$salida" | tail -n 25
            motivo="$(printf '%s\n' "$salida" | grep -iE 'login|denied|incorrect|certificate|fatal|error|refused|timed out' | tail -n 2 | tr '\n' ' ')"
            echo "::error title=FTP::${motivo:-la subida falló} — Si dice 'Login incorrect', revisa FTP_USUARIO (usuario@profesoraevelyn.com) y FTP_CLAVE."
            exit 1
          fi
          printf '%s\n' "$salida" | tail -n 8
          echo "::notice title=Subida lista::$(printf '%s\n' "$salida" | grep -c '^Transferring\|^Removing' || true) cambios sincronizados en la carpeta de la aplicación y reinicio solicitado."

      - name: Comprobar que la nueva versión está en línea
        if: steps.config.outputs.listo == 'si' && env.BALANZA_URL != ''
        run: |
          esperada="${COMMIT:0:12}"
          for intento in $(seq 1 30); do
            respuesta="$(curl -fsS --max-time 10 "${BALANZA_URL%/}/api/salud" || true)"
            if printf '%s' "$respuesta" | grep -q "\"version\":\"$esperada\""; then
              echo "✅ En línea: versión $esperada"
              exit 0
            fi
            echo "Esperando que reinicie… ($intento/30) $respuesta"
            sleep 6
          done
          echo "::error::La aplicación no respondió con la versión $esperada. Revisa el registro de errores en Setup Node.js App."
          exit 1
