# Despliegue automático al hosting (cPanel de V2Networks).
#
# Cuando las pruebas pasan en main, compila el juego y el servidor, los sube a la
# carpeta de la aplicación Node.js y la reinicia. Luego comprueba en
# /api/salud que quedó en línea la versión recién subida.
#
# Mientras no existan los secretos, el flujo termina sin hacer nada (no falla).
# Guía paso a paso: docs/despliegue.md
name: Desplegar

on:
  workflow_run:
    workflows: [Pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      BALANZA_URL: ${{ secrets.BALANZA_URL }}
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: ¿Está configurado el despliegue?
        id: config
        run: |
          if [ -z "$SSH_HOST" ] && [ -z "$FTP_HOST" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue sin configurar::Agrega los secretos SSH_* (o FTP_*) y BALANZA_URL. Guía: docs/despliegue.md"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'
        with:
          ref: ${{ env.COMMIT }}

      - uses: actions/setup-node@v4
        if: steps.config.outputs.listo == 'si'
        with:
          node-version: 22
          cache: npm

      - name: Compilar juego y servidor
        if: steps.config.outputs.listo == 'si'
        run: |
          npm ci
          npm run build
        env:
          BALANZA_VERSION: ${{ env.COMMIT }}

      - name: Subir por SSH (rsync)
        if: steps.config.outputs.listo == 'si' && env.SSH_HOST != ''
        env:
          SSH_USUARIO: ${{ secrets.SSH_USUARIO }}
          SSH_PUERTO: ${{ secrets.SSH_PUERTO }}
          SSH_CLAVE_PRIVADA: ${{ secrets.SSH_CLAVE_PRIVADA }}
          SSH_FRASE: ${{ secrets.SSH_FRASE }}
          SSH_HOSTS_CONOCIDOS: ${{ secrets.SSH_HOSTS_CONOCIDOS }}
          RUTA_APP: ${{ secrets.RUTA_APP }}
        run: |
          set -euo pipefail
          : "${RUTA_APP:?Falta el secreto RUTA_APP (por ejemplo /home/tuusuario/balanza-app)}"
          PUERTO="${SSH_PUERTO:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_CLAVE_PRIVADA" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # Si cPanel exigió una contraseña para la clave, se quita solo en esta máquina temporal.
          if [ -n "${SSH_FRASE:-}" ]; then
            ssh-keygen -p -q -P "$SSH_FRASE" -N "" -f ~/.ssh/id_despliegue
          fi
          if [ -n "${SSH_HOSTS_CONOCIDOS:-}" ]; then
            printf '%s\n' "$SSH_HOSTS_CONOCIDOS" > ~/.ssh/known_hosts
          else
            echo "::warning::Sin SSH_HOSTS_CONOCIDOS: se confía en la huella del servidor en el primer contacto."
            ssh-keyscan -p "$PUERTO" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          SSH="ssh -i ~/.ssh/id_despliegue -p $PUERTO -o BatchMode=yes"
          # --delete quita archivos viejos del juego, pero nunca .env, tmp/, registros ni node_modules.
          rsync -az --delete \
            --exclude '.env' --exclude 'tmp/' --exclude '*.log' --exclude 'node_modules' --exclude '.htaccess' \
            -e "$SSH" apps/servidor/dist/ "$SSH_USUARIO@$SSH_HOST:$RUTA_APP/"
          # Passenger (Setup Node.js App) reinicia la aplicación al tocar tmp/restart.txt.
          $SSH "$SSH_USUARIO@$SSH_HOST" "mkdir -p '$RUTA_APP/tmp' && touch '$RUTA_APP/tmp/restart.txt'"
          rm -f ~/.ssh/id_despliegue

      - name: Subir por FTP seguro (si no hay SSH)
        if: steps.config.outputs.listo == 'si' && env.SSH_HOST == '' && env.FTP_HOST != ''
        env:
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_CLAVE: ${{ secrets.FTP_CLAVE }}
          FTP_RUTA: ${{ secrets.FTP_RUTA }}
        run: |
          set -euo pipefail
          : "${FTP_RUTA:?Falta el secreto FTP_RUTA (por ejemplo /balanza-app)}"
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p reinicio && date > reinicio/restart.txt
          lftp -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set net:max-retries 3; set net:timeout 30;
            open -u \"$FTP_USUARIO\",\"$FTP_CLAVE\" \"$FTP_HOST\";
            mirror --reverse --delete --verbose=1 \
              --exclude-glob .env --exclude-glob '*.log' --exclude tmp/ --exclude node_modules/ --exclude-glob .htaccess \
              apps/servidor/dist \"$FTP_RUTA\";
            mkdir -p \"$FTP_RUTA/tmp\";
            put -O \"$FTP_RUTA/tmp\" reinicio/restart.txt;
            bye"

      - name: Comprobar que la nueva versión está en línea
        if: steps.config.outputs.listo == 'si' && env.BALANZA_URL != ''
        run: |
          esperada="${COMMIT:0:12}"
          for intento in $(seq 1 30); do
            respuesta="$(curl -fsS --max-time 10 "${BALANZA_URL%/}/api/salud" || true)"
            if printf '%s' "$respuesta" | grep -q "\"version\":\"$esperada\""; then
              echo "✅ En línea: versión $esperada"
              exit 0
            fi
            echo "Esperando que reinicie… ($intento/30) $respuesta"
            sleep 6
          done
          echo "::error::La aplicación no respondió con la versión $esperada. Revisa el registro de errores en Setup Node.js App."
          exit 1
