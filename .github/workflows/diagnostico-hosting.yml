# Diagnóstico manual: ¿qué puertos del hosting responden desde GitHub?
# Actions → Diagnóstico del hosting → Run workflow. No cambia nada en el servidor.
name: Diagnóstico del hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  puertos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Probar puertos SSH y FTP
        run: |
          H="$(printf '%s' "$HOST" | tr -d '[:space:]')"
          abiertos=""
          for p in 22 2222 2200 2022 22022 7822 21098 18765 1022 21 990 443; do
            if timeout 6 bash -c "</dev/tcp/$H/$p" 2>/dev/null; then
              banner="$(timeout 5 bash -c "exec 3<>/dev/tcp/$H/$p; head -c 60 <&3" 2>/dev/null | tr -dc '[:print:]' || true)"
              abiertos="$abiertos $p"
              echo "::notice title=Puerto $p abierto::${banner:-(sin mensaje inicial)}"
            fi
          done
          echo "::notice title=Resumen::Puertos que responden:${abiertos:- ninguno}"
      - name: Certificado del servidor FTP
        run: |
          H="$(printf '%s' "$HOST" | tr -d '[:space:]')"
          cert="$(timeout 20 openssl s_client -starttls ftp -connect "$H:21" -servername "$H" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ' || true)"
          echo "::notice title=Certificado FTP::${cert:-no se pudo leer}"
      - name: Probar la conexión FTP (solo lista la carpeta)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          FTP_CLAVE: ${{ secrets.FTP_CLAVE }}
        run: |
          if [ -z "$FTP_HOST" ]; then echo "::notice title=FTP::sin FTP_HOST"; exit 0; fi
          command -v lftp > /dev/null || { sudo apt-get update -qq > /dev/null 2>&1; sudo apt-get install -y -qq lftp > /dev/null 2>&1; }
          H="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          echo "::notice title=DNS::$H → $(getent hosts "$H" | awk '{print $1}' | tr '\n' ' ')"
          export LFTP_PASSWORD="$(printf '%s' "$FTP_CLAVE" | tr -d '\r\n')"
          U="$(printf '%s' "$FTP_USUARIO" | tr -d '[:space:]')"
          for modo in "set ssl:verify-certificate true" "set ssl:verify-certificate false"; do
            salida="$(timeout 60 lftp -d -u "$U" --env-password -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; $modo; set net:max-retries 1; set net:timeout 20; cls -1; bye" "$H" 2>&1 || true)"
            resumen="$(printf '%s\n' "$salida" | grep -vi 'PASS' | grep -E '^(<---|--->|\*\*\*\*|[a-zA-Z])' | tail -n 6 | tr '\n' ' ')"
            echo "::notice title=FTP ($modo)::$resumen"
          done
