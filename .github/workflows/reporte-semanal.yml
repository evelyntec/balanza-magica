# Reporte semanal para la docente, por correo.
#
# Todos los viernes en la tarde (hora de Chile) descarga el registro de
# desafíos desde el panel docente, lo resume y envía un correo con los
# estudiantes que necesitan apoyo, los errores más frecuentes con una
# sugerencia para la clase y el informe completo adjunto.
#
# Mientras no existan los secretos, termina sin hacer nada (no falla).
# También se puede lanzar a mano: Actions → Reporte semanal → Run workflow.
# Guía: docs/despliegue.md
name: Reporte semanal

on:
  schedule:
    # Viernes 21:47 UTC = 18:47 en horario de verano de Chile (17:47 en invierno).
    - cron: '47 21 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BALANZA_URL: ${{ secrets.BALANZA_URL }}
      CLAVE_DOCENTE: ${{ secrets.CLAVE_DOCENTE }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
      SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
      SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
      CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
      CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
    steps:
      - name: ¿Está configurado el reporte?
        id: config
        run: |
          if [ -z "$BALANZA_URL" ] || [ -z "$CLAVE_DOCENTE" ] || [ -z "$SMTP_HOST" ] || [ -z "$CORREO_DESTINO" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Reporte sin configurar::Agrega BALANZA_URL, CLAVE_DOCENTE, SMTP_* y CORREO_DESTINO. Guía: docs/despliegue.md"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.listo == 'si'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.listo == 'si'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: herramientas/analisis/requirements.txt
      - name: Enviar el reporte
        if: steps.config.outputs.listo == 'si'
        working-directory: herramientas/analisis
        run: |
          pip install -q -r requirements.txt
          python reporte_semanal.py
